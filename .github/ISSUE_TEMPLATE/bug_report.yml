name: Bug report
description: Report a bug in Nexora
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Nexora. Please search existing issues before opening a new one.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the problem
      placeholder: |
        1. Run `pnpm ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nexora / package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - core
        - config
        - logger
        - database
        - auth
        - api
        - plugin-system
        - websocket
        - ui
        - cli
        - dashboard
        - other / unknown
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 20.x
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack traces
      render: shell
